name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装 MinGW（编译原生启动器）
        run: choco install mingw -y --no-progress
        continue-on-error: true

      - name: 校验 tag 与版本号一致
        run: python scripts/check_version.py --tag ${{ github.ref_name }}

      - name: 构建便携包
        run: python scripts/build_portable.py

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} dist/DiskCleaner-portable.zip --title "DiskCleaner ${{ github.ref_name }}" --generate-notes
