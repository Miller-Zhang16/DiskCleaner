name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 代码检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装开发依赖
        run: python -m pip install -r requirements-dev.txt

      - name: 代码规范检查
        run: ruff check .

      - name: 语法编译检查
        run: python -m compileall -q main.py src scripts

      - name: 模块导入检查
        run: |
          python -c "import src.core.classify, src.core.cleaner, src.core.scanner, src.core.targets, src.core.recycle, src.utils.config, src.utils.logger, src.utils.fmt, src.utils.taskrunner, src.gui.app; print('imports ok')"

      - name: 单元测试
        run: python -m pytest tests/ -v

      - name: 校验版本号与 CHANGELOG 一致
        run: python scripts/check_version.py
